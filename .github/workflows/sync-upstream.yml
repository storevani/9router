name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/storevani/9router
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: storevani-ghcr
  cancel-in-progress: false

jobs:
  sync:
    # Only the canonical default branch is allowed to update master or GHCR.
    if: github.repository == 'storevani/9router' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Provision GHCR_PUBLISH_TOKEN as an environment-only secret and configure
    # ghcr-production to allow deployments solely from master.
    environment:
      name: ghcr-production

    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: true

      - name: Prepare and verify upstream release (local only)
        id: release
        run: |
          set -euo pipefail
          bash .github/scripts/sync-upstream-release.sh

      - name: Check GHCR publish credentials before changing master
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GHCR_PUBLISH_TOKEN" ]; then
            echo "::error::Missing protected environment secret GHCR_PUBLISH_TOKEN."
            echo "Create a protected ghcr-production environment (master only) and move the PAT there." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR before changing master
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Inspect GHCR image revisions before changing master
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          export REVISION="$(git rev-parse HEAD)"
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"
          bash .github/scripts/ghcr-preflight.sh

      - name: Verify Docker build without publishing
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
          provenance: false
          sbom: false

      - name: Prepare release metadata before changing master
        if: steps.image.outputs.needed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.revision }}
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Push validated release commit to master
        run: |
          set -euo pipefail
          # This is a fast-forward-only push: a concurrent source update rejects it.
          git push origin HEAD:refs/heads/master
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)"

      - name: Publish validated GHCR image
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          build-args: |
            APP_VERSION=${{ steps.release.outputs.version }}
          platforms: linux/amd64
          provenance: false
          sbom: false
