name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/storevani/9router
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: storevani-ghcr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Sync and verify latest upstream release
        id: release
        run: |
          set -euo pipefail
          bash .github/scripts/sync-upstream-release.sh
          # Only publish code based on the current remote master.
          # Fail closed on a concurrent update rather than merging unreviewed changes.
          git push origin HEAD:master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify GHCR token
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "Missing repository secret GHCR_TOKEN."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check published revision and release image
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

          inspect_revision() {
            local image="$1"
            local result error_file
            error_file="$(mktemp)"
            if result="$(docker buildx imagetools inspect "$image" --format '{{json .Image}}' 2>"$error_file")"; then
              rm -f "$error_file"
              jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<< "$result"
            elif grep -Eqi 'manifest unknown|manifest.*not found|not found|404' "$error_file"; then
              echo "Image $image does not exist yet." >&2
              rm -f "$error_file"
              printf '\n'
            else
              echo "::error::Failed to inspect $image" >&2
              cat "$error_file" >&2
              rm -f "$error_file"
              return 1
            fi
          }

          published="$(inspect_revision "${GHCR_IMAGE}:latest")"
          release_published="$(inspect_revision "${GHCR_IMAGE}:${VERSION}")"
          if [ "$published" = "$revision" ] && [ "$release_published" = "$revision" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Both latest and ${VERSION} already match $revision." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing latest and ${VERSION} for $revision." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract Docker metadata
        if: steps.image.outputs.needed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.revision }}
            type=raw,value=latest
            type=raw,value=${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}

      - name: Build and push image
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
