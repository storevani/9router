name: Sync upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  GHCR_IMAGE: ghcr.io/storevani/9router
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: storevani-ghcr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream
        id: merge-upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/decolua/9router.git
          git fetch upstream master:refs/remotes/upstream/master

          git fetch origin master
          git merge --ff-only origin/master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Fork already contains upstream/master."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git merge --no-commit -X theirs upstream/master; then
            conflicts="$(git diff --name-only --diff-filter=U || true)"
            echo "Merge reported conflicts:"
            printf '%s\n' "$conflicts"

            unexpected="$(
              printf '%s\n' "$conflicts" |
                grep -v -E '^(Dockerfile|\.github/workflows/.*)$' || true
            )"

            if [ -n "$unexpected" ]; then
              echo "Unexpected conflicts require manual resolution:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
          fi

          # Fork automation is maintained separately from upstream application code.
          git restore --source=HEAD --staged --worktree .github/workflows
          git restore --source=upstream/master --staged --worktree Dockerfile

          remaining_conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$remaining_conflicts" ]; then
            echo "Remaining conflicts require manual resolution:"
            printf '%s\n' "$remaining_conflicts"
            exit 1
          fi

          git commit --no-edit
          git log --oneline -1
          for attempt in 1 2 3; do
            if git push origin HEAD:master; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin master
            git merge --no-edit origin/master
          done
          echo "Could not push after three attempts."
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify GHCR token
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "Missing repository secret GHCR_TOKEN."
            echo "Create a classic PAT with write:packages, read:packages, and repo, then save it as GHCR_TOKEN."
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Check published revision
        id: image
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          published="$(docker buildx imagetools inspect "${GHCR_IMAGE}:latest" --format '{{json .Image}}' | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          if [ "$published" = "$revision" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Image already matches $revision; skipping build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Publishing $revision (previous image: $published)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Extract Docker metadata
        if: steps.image.outputs.needed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=sha-${{ steps.image.outputs.revision }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}

      - name: Build and push image
        if: steps.image.outputs.needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false
          sbom: false
