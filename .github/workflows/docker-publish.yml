name: Validate Docker image (no publish)

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-only:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout exact trigger revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Deliberately do not read GHCR secrets or push registry tags here.
      # Only Sync upstream may publish GHCR, using a protected environment.
      - name: Validate Docker build (no publishing)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          outputs: type=cacheonly
          provenance: false
          sbom: false
