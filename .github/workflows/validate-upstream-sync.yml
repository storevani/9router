name: Validate upstream release sync

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/sync-upstream.yml"
      - ".github/workflows/validate-upstream-sync.yml"
      - ".github/scripts/sync-upstream-release.sh"
      - ".github/scripts/test-sync-upstream-release.sh"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout proposed changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate GitHub Actions workflow syntax
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: Validate shell syntax
        run: |
          bash -n .github/scripts/sync-upstream-release.sh
          bash -n <(sed -n '/^          inspect_revision() {/,/^          }/p' .github/workflows/sync-upstream.yml | sed 's/^          //')

      - name: Reject divergent, downgraded, and falsified release history
        run: |
          bash -n .github/scripts/test-sync-upstream-release.sh
          bash .github/scripts/test-sync-upstream-release.sh

      - name: Ensure secondary GHCR publisher never sets latest
        run: |
          set -euo pipefail
          workflow=".github/workflows/docker-publish.yml"
          if ! grep -Eq '^[[:space:]]+latest=false[[:space:]]*        id: sync
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          bash .github/scripts/sync-upstream-release.sh
          version="$(node -p 'require("./package.json").version')"
          grep -Fx "version=$version" "$GITHUB_OUTPUT"
          git diff --exit-code "$before" HEAD -- .github Dockerfile
          echo "Validated release v${version} on local CI checkout only." >> "$GITHUB_STEP_SUMMARY"
 "$workflow"; then
            echo "::error::docker/metadata-action must have flavor latest=false"
            exit 1
          fi
          if grep -Eq '^[[:space:]]+type=raw,value=latest[[:space:]]*        id: sync
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          bash .github/scripts/sync-upstream-release.sh
          version="$(node -p 'require("./package.json").version')"
          grep -Fx "version=$version" "$GITHUB_OUTPUT"
          git diff --exit-code "$before" HEAD -- .github Dockerfile
          echo "Validated release v${version} on local CI checkout only." >> "$GITHUB_STEP_SUMMARY"
 "$workflow"; then
            echo "::error::Secondary GHCR publisher must not tag latest"
            exit 1
          fi

      - name: Dry-run release merge without pushing
        id: sync
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          bash .github/scripts/sync-upstream-release.sh
          version="$(node -p 'require("./package.json").version')"
          grep -Fx "version=$version" "$GITHUB_OUTPUT"
          git diff --exit-code "$before" HEAD -- .github Dockerfile
          echo "Validated release v${version} on local CI checkout only." >> "$GITHUB_STEP_SUMMARY"
